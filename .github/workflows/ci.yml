name: CustomerIQ CI Pipeline

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python 3.11.16
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11.16"
        cache: "pip"
        cache-dependency-path: requirements-test.lock

    - name: Install Test Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --require-hashes -r requirements-test.lock

    - name: Verify Dependency Consistency
      run: python -m pip check

    - name: Validate Operational Configuration
      run: python -c "import pathlib, yaml; yaml.safe_load(pathlib.Path('ops/prometheus-alerts.yml').read_text(encoding='utf-8'))"

    - name: Reproduce Development-Only ML Evidence
      run: python scripts/run_development_experiment.py --output development-evidence.ci.json

    - name: Run Pytest Test Suite
      run: |
        python -m pytest -q

    - name: Set up Node.js 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "22"
        cache: npm

    - name: Install Browser Test Dependencies
      run: |
        npm ci --ignore-scripts
        npm audit --audit-level=high
        npx playwright install --with-deps chromium

    - name: Run Desktop and Mobile Browser Tests
      run: npm run test:e2e

  container-smoke:
    needs: test-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Build Runtime Image
      run: docker build --tag customeriq:ci .

    - name: Generate Container SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        image: customeriq:ci
        format: spdx-json
        artifact-name: customeriq-ci.spdx.json
        upload-release-assets: false

    - name: Scan Container for Fixable High/Critical Vulnerabilities
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        image-ref: customeriq:ci
        format: table
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: 1

    - name: Start Runtime Image
      id: start-runtime
      run: |
        docker run --detach --name customeriq-ci --publish 8000:8000 \
          --env CUSTOMERIQ_ENVIRONMENT=production \
          --env CUSTOMERIQ_REQUIRE_API_KEY=true \
          --env CUSTOMERIQ_API_KEYS=ci-local-only-key-0123456789abcdef \
          customeriq:ci

    - name: Verify Non-root Runtime and Health
      run: |
        test "$(docker inspect --format '{{.Config.User}}' customeriq-ci)" = "customeriq"
        for attempt in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
            exit 0
          fi
          sleep 1
        done
        docker logs customeriq-ci
        exit 1

    - name: Smoke-test Authenticated Inference and Metrics
      env:
        API_KEY: ci-local-only-key-0123456789abcdef
      run: |
        curl --fail --silent \
          --header "Content-Type: application/json" \
          --header "X-API-Key: ${API_KEY}" \
          --data '{"gender":"Female","SeniorCitizen":0,"Partner":"No","Dependents":"No","tenure":2,"PhoneService":"Yes","MultipleLines":"No","InternetService":"Fiber optic","OnlineSecurity":"No","OnlineBackup":"No","DeviceProtection":"No","TechSupport":"No","StreamingTV":"Yes","StreamingMovies":"Yes","Contract":"Month-to-month","PaperlessBilling":"Yes","PaymentMethod":"Electronic check","MonthlyCharges":85.5,"TotalCharges":171.0}' \
          http://127.0.0.1:8000/predict | python -m json.tool
        curl --fail --silent \
          --header "X-API-Key: ${API_KEY}" \
          http://127.0.0.1:8000/metrics | grep --fixed-strings customeriq_inference_requests_total

    - name: Show Container Logs on Failure
      if: failure() && steps.start-runtime.outcome == 'success'
      run: docker logs customeriq-ci

    - name: Stop Runtime Image
      if: always()
      run: docker rm --force customeriq-ci
