version: '3.8'

services:
  customeriq-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: customeriq-api:latest
    container_name: customeriq_inference_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
